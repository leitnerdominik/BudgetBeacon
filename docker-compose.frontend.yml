services:
  frontend:
    build:
      context: ./budgetbeacon-front
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_DEV_PROXY_TARGET: "http://host.docker.internal:5078"
    volumes:
      - ./budgetbeacon-front:/app
      - frontend_node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  frontend_node_modules:
