name: Deploy BudgetBeacon

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: budgetbeacon-front/package-lock.json

      - name: Restore backend
        run: dotnet restore budgetbeacon-back/BudgetBeacon.sln

      - name: Test backend
        run: dotnet test budgetbeacon-back/BudgetBeacon.sln --configuration Release --no-restore

      - name: Publish backend
        run: >
          dotnet publish budgetbeacon-back/BudgetBeacon.Api/BudgetBeacon.Api.csproj
          --configuration Release
          --no-restore
          --output publish/backend

      - name: Build frontend
        working-directory: budgetbeacon-front
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/budgetbeacon_deploy_key
          chmod 600 ~/.ssh/budgetbeacon_deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload backend
        run: >
          rsync -az --delete
          -e "ssh -i ~/.ssh/budgetbeacon_deploy_key"
          publish/backend/
          "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_BACK_DIR }}/"

      - name: Upload frontend
        run: >
          rsync -az --delete
          -e "ssh -i ~/.ssh/budgetbeacon_deploy_key"
          budgetbeacon-front/dist/
          "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_FRONT_DIR }}/"
